[project]
name = "redline"
version = "0.1.0"
description = "Local-first AI contract red-flag scanner for freelancers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "itzneel05" }]
keywords = ["contracts", "freelance", "privacy", "local-first", "llm", "gemma"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
redline = "redline.cli:main"
redline-web = "redline.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.setuptools.package-data]
redline = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
